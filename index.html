<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" 
    content="width=device-width, 
    initial-scale=1.0">
  <title>SAGE BOT MANAGER</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}
body {
  background: #0a0a0a;
  color: #fff;
  min-height: 100vh;
}
.panel {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px;
}
.header {
  text-align: center;
  padding: 20px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border-radius: 15px;
  margin-bottom: 20px;
  border: 1px solid #ffd700;
}
.header h1 {
  font-size: 20px;
  color: #ffd700;
  margin-bottom: 10px;
}
.status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.dot {
  width: 12px;
  height: 12px;
  background: #00ff00;
  border-radius: 50%;
  animation: blink 1s infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
.card {
  background: #1a1a2e;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 15px;
  border: 1px solid #333;
}
.card h2 {
  color: #ffd700;
  margin-bottom: 10px;
  font-size: 16px;
}
.card input {
  width: 100%;
  padding: 10px;
  background: #0a0a0a;
  border: 1px solid #ffd700;
  border-radius: 8px;
  color: #fff;
  font-size: 16px;
}
#pairing-code {
  font-size: 28px;
  font-weight: bold;
  color: #ffd700;
  text-align: center;
  letter-spacing: 5px;
  padding: 10px;
}
.buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 15px;
}
.btn {
  padding: 15px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
.start {
  background: linear-gradient(135deg, #00b09b, #96c93d);
  color: white;
}
.stop {
  background: linear-gradient(135deg, #ff416c, #ff4b2b);
  color: white;
}
.restart {
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: black;
}
.btn:active { transform: scale(0.95); }
#logs {
  background: #0a0a0a;
  border-radius: 8px;
  padding: 10px;
  height: 200px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 13px;
}
#logs p {
  padding: 5px 0;
  border-bottom: 1px solid #222;
  color: #00ff00;
}
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <h1>⚡ SAGE BOT MANAGER ⚡</h1>
      <div class="status">
        <span class="dot"></span>
        <span id="status-text">Ready</span>
      </div>
    </div>
    <div class="card">
      <h2>📱 Phone Number</h2>
      <input type="text" id="phone"
        placeholder="263783766205"
        value="263783766205"/>
    </div>
    <div class="card">
      <h2>🔑 Pairing Code</h2>
      <div id="pairing-code">Waiting...</div>
    </div>
    <div class="buttons">
      <button class="btn start" onclick="startBot()">
        ▶️ START BOT
      </button>
      <button class="btn stop" onclick="stopBot()">
        ⏹️ STOP BOT
      </button>
      <button class="btn restart" onclick="restartBot()">
        🔄 RESTART
      </button>
    </div>
    <div class="card">
      <h2>📋 LOGS</h2>
      <div id="logs">
        <p>✅ Panel Loaded!</p>
      </div>
    </div>
  </div>
  <script>
function addLog(message) {
  const logs = document.getElementById("logs");
  const p = document.createElement("p");
  p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
  logs.prepend(p);
}
function startBot() {
  document.getElementById("status-text").textContent = "Starting...";
  addLog("▶️ Starting SAGE BOT...");
  setTimeout(() => {
    document.getElementById("status-text").textContent = "Online";
    addLog("✅ SAGE BOT Started!");
    addLog("🟢 Bot Is Now Online!");
  }, 2000);
}
function stopBot() {
  document.getElementById("status-text").textContent = "Offline";
  addLog("⏹️ SAGE BOT Stopped!");
}
function restartBot() {
  addLog("🔄 Restarting SAGE BOT...");
  stopBot();
  setTimeout(() => startBot(), 2000);
}
window.onload = () => {
  addLog("✅ Panel Loaded!");
  addLog("⚡ SAGE BOT Manager Ready!");
  document.getElementById("status-text").textContent = "Ready";
};
  </script>
</body>

</html>
